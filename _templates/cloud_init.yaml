#cloud-config
# Rendered by _scripts/render_template.sh.
# Text snippets live in _templates/cloud_init.inputrc, cloud_init.motd.sh,
# and setup-kube-netplan.sh.

ssh_authorized_keys:
  - __PUBKEY__

write_files:
  - path: /root/.inputrc
    content: |
__INPUTRC_CONTENT__
  - path: /tmp/setup_kube.inputrc
    content: |
__INPUTRC_CONTENT__
  - path: /etc/update-motd.d/99-setup-kube
    permissions: '0755'
    content: |
__MOTD_CONTENT__
  - path: /usr/local/sbin/setup-kube-netplan.sh
    permissions: '0755'
    content: |
__NETPLAN_SCRIPT_CONTENT__
runcmd:
  - test -d /home/__KUSER__ || { echo 'Missing expected user home /home/__KUSER__' >&2; exit 1; }
  - install -d -o __KUSER__ -g __KUSER__ -m 0755 /home/__KUSER__/__BASESETUPDIR__
  - install -o __KUSER__ -g __KUSER__ -m 0644 /tmp/setup_kube.inputrc /home/__KUSER__/.inputrc
  - /usr/local/sbin/setup-kube-netplan.sh
  - chmod -x /etc/update-motd.d/* 2>/dev/null || true
  - chmod 0755 /etc/update-motd.d/99-setup-kube
  - ': > /etc/motd'
  - grep -q 'PrintLastLog' /etc/ssh/sshd_config && sed -i 's/^#*[[:space:]]*PrintLastLog.*/PrintLastLog no/' /etc/ssh/sshd_config || echo 'PrintLastLog no' >> /etc/ssh/sshd_config
  - systemctl reload ssh 2>/dev/null || systemctl reload sshd 2>/dev/null || true
# - echo 'Intentional cloud-init failure for mp_kcluster_launch.sh testing' >&2
# - exit 42
